<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Zigola scientific engineering profile banner</title>
  <desc id="desc">A dark blue and teal abstract banner for a developer working with AI, data, and scientific computing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2f45"/>
      <stop offset="1" stop-color="#087f8c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6c1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#55e6c1" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#55e6c1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b6fff0" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="420" fill="url(#background)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <circle cx="1320" cy="80" r="190" fill="#55e6c1" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="1460" cy="340" r="170" fill="#62b6ff" fill-opacity="0.14" filter="url(#blur)"/>
  <path d="M0 330C230 245 340 390 570 295S925 155 1160 255s285 40 440-55" fill="none" stroke="url(#glow)" stroke-width="2"/>
  <g fill="none" stroke="#9af7df" stroke-opacity="0.68">
    <circle cx="1270" cy="188" r="78"/>
    <circle cx="1270" cy="188" r="42"/>
    <path d="M1270 92v192M1174 188h192M1202 120l136 136M1338 120l-136 136"/>
  </g>
  <g fill="#d5fff5">
    <circle cx="1270" cy="110" r="4"/><circle cx="1348" cy="188" r="4"/><circle cx="1270" cy="266" r="4"/><circle cx="1192" cy="188" r="4"/>
  </g>
  <text x="110" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="8">ZIGOLA</text>
  <text x="116" y="225" fill="#b9fff0" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="3">AI • DATA • SCIENTIFIC COMPUTING</text>
  <rect x="116" y="264" width="420" height="2" fill="#55e6c1" fill-opacity="0.75"/>
  <text x="116" y="310" fill="#d8eaf2" font-family="Arial, Helvetica, sans-serif" font-size="20">Building useful things carefully, one experiment at a time.</text>
</svg>
